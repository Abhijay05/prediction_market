# infra/prometheus.yml

global:
  scrape_interval:     15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: "lvramm-api"
    static_configs:
      - targets: ["api:3001"]
    metrics_path: "/metrics"

  - job_name: "lvramm-worker"
    static_configs:
      - targets: ["worker:3002"]
    metrics_path: "/metrics"