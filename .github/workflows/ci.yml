# .github/workflows/ci.yml
name: CI

on:
  push:
    branches: [main, dev]
  pull_request:
    branches: [main]

jobs:

  # ── Smart contract tests (Foundry) ──────────────────────────────────────────
  contracts:
    name: Foundry tests + fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Run unit tests
        working-directory: contract
        run: forge test -vvv

      - name: Run fuzz tests (256 runs)
        working-directory: contract
        run: forge test --match-contract PredictionMarketFuzzTest --fuzz-runs 256 -vvv

      - name: Check contract sizes
        working-directory: contract
        run: forge build --sizes

  # ── Backend: type-check + unit tests ────────────────────────────────────────
  backend:
    name: Backend (tsc + jest)
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER:     postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB:       lvramm_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    defaults:
      run:
        working-directory: backend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Generate Prisma client
        run: npx prisma generate

      - name: Type-check
        run: npx tsc --noEmit

      - name: Run tests
        env:
          DATABASE_URL:     postgresql://postgres:postgres@localhost:5432/lvramm_test
          REDIS_URL:        redis://localhost:6379
          JWT_SECRET:       test-secret-32-chars-minimum-length
          ALCHEMY_API_KEY:  test-key
          ROUTER_ADDRESS:   "0x0000000000000000000000000000000000000000"
          NODE_ENV:         test
        run: npm test -- --coverage

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        with:
          name: backend-coverage
          path: backend/coverage

  # ── Docker build check ───────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    needs: backend
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: |
          docker build \
            --target production \
            --tag lvramm-backend:${{ github.sha }} \
            ./backend

      - name: Check image size
        run: docker image inspect lvramm-backend:${{ github.sha }} --format='{{.Size}}' | awk '{printf "Image size: %.1f MB\n", $1/1024/1024}'

  # ── Frontend type-check ──────────────────────────────────────────────────────
  frontend:
    name: Frontend (tsc)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type-check
        run: npx tsc --noEmit